name: 问题反馈
description: 报告使用 GitMaster 时遇到的问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: "请勿上传令牌、私钥、含密码的地址或完整私有仓库。日志与截图请先脱敏。"
  - type: input
    id: version
    attributes:
      label: GitMaster 版本
      placeholder: "例如：0.1.0；自行构建请注明提交版本"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 操作系统与处理器架构
      placeholder: "例如：Windows 11 x64 / macOS 版本与 Apple Silicon"
    validations:
      required: true
  - type: input
    id: git-version
    attributes:
      label: Git 版本（如已知）
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: "说明从哪个页面开始、进行了哪些操作；尽量使用脱敏示例。"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: "如有错误码，请原样填写。"
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: 脱敏截图或补充信息
