name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [agent]
    paths: [.github/workflows/package-windows.yml]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile
      - name: 格式与类型检查
        run: |
          pnpm format:check
          pnpm typecheck
          cargo fmt --all -- --check
      - name: 构建 Windows NSIS 安装包
        run: pnpm tauri build --bundles nsis
      - name: 验证独立 Agent 资源
        run: pnpm test:agent:bundle
      - name: 生成安装包校验值
        shell: pwsh
        run: |
          $packages = Get-ChildItem target/release/bundle/nsis/*.exe
          if (-not $packages) { throw '未生成 NSIS 安装包' }
          $packages | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content target/release/bundle/nsis/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: GitMaster-windows-x64-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
