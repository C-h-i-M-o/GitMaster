[package]
name = "gitmaster-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "gitMaster Tauri 桌面适配层"

[lib]
# 库名与可执行文件名分离，避免 Windows 构建产物重名。
name = "gitmaster_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
gitmaster-core = { path = "../crates/gitmaster-core" }
serde.workspace = true
serde_json = "1"
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-opener = "=2.5.3"
tauri-plugin-log = "=2.9.2"
log = "0.4"
dunce = "=1.0.5"

[features]
log-plugin-tests = ["tauri/test"]
