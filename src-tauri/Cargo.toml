[package]
name = "gitmaster-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "gitMaster Tauri 桌面适配层"

[lib]
# 库名与可执行文件名分离，避免 Windows 构建产物重名。
name = "gitmaster_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
gitmaster-core = { path = "../crates/gitmaster-core" }
serde.workspace = true
serde_json = "1"
url = "=2.5.8"
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-opener = "=2.5.3"
tauri-plugin-log = "=2.9.2"
log = "0.4"
dunce = "=1.0.5"
portable-pty = "=0.9.0"
keyring = { version = "=3.6.3", features = ["windows-native", "apple-native"] }
getrandom = "=0.3.4"

[features]
log-plugin-tests = ["tauri/test"]

[dev-dependencies]
tempfile = "=3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "=0.14.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.45.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }
